html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.pr{margin:10px 0}.pr div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px}

.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.kp button{padding:11px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}.kp .eq{background:var(--ac);color:var(--act);border:0}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.steps{font-size:14px;color:var(--mu);border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}details summary{cursor:pointer;font-weight:600}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
